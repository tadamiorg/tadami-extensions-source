// The extensions-lib (gradle/libs.versions.toml) an extension compiles against, by its lib version
// (apiVersion). 1.5 was never published: lib-1.6.0 covers it, and the release refuses a 1.5 extension
// using a 1.6 member (API_REQUIREMENTS in .github/scripts/publish_extensions.py).
def libByApiVersion = [
        "1.5": "tadami-lib-v1_6",
        "1.6": "tadami-lib-v1_6",
        "1.7": "tadami-lib-v1_7",
]
def apiVersion = project.ext.properties.getOrDefault("apiVersion", build.versions.latestApiVersion.get())
def extensionsLib = libByApiVersion[apiVersion]
if (extensionsLib == null) {
    throw new GradleException("$project.path: no extensions-lib for apiVersion $apiVersion, " +
            "expected one of ${libByApiVersion.keySet().join(", ")} (see common.gradle)")
}

android {
    compileSdkVersion build.versions.compileSdk.get().toInteger()
    namespace "com.sf.tadami.extension.$pkgNameSuffix"

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
        release {
            manifest.srcFile "AndroidManifest.xml"
        }
        debug {
            manifest.srcFile "AndroidManifest.xml"
        }
    }

    defaultConfig {
        minSdkVersion build.versions.minSdk.get().toInteger()
        targetSdkVersion build.versions.targetSdk.get().toInteger()
        versionCode extVersionCode
        versionName "$apiVersion.$extVersionCode"
        manifestPlaceholders = [
                appName : "Tadami: $extName",
                extClass: extClass
        ]
    }

    // fetch() reads environment variables first, then .env: CI has no .env, so the typed env.KEY_FILE
    // accessors (generated from .env keys) don't exist there
    signingConfigs {
        release {
            storeFile file(env.fetch("KEY_FILE"))
            storePassword env.fetch("KEY_STORE_PASSWORD")
            keyAlias env.fetch("ALIAS")
            keyPassword env.fetch("KEY_STORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }


    dependenciesInfo {
        includeInApk = false
    }

    buildFeatures {
        // Disable unused AGP features
        aidl false
        renderScript false
        resValues false
        shaders false
        buildConfig true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "tadami-${pkgNameSuffix}-v${versionName}.apk"
        }
    }
}

dependencies {
    implementation(project(":core"))
    compileOnly(versionCatalogs.named("libs").findLibrary(extensionsLib).get())
    compileOnly(libs.bundles.common)
}
