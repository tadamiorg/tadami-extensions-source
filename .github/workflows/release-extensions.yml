# Builds the chosen extensions and publishes them to the extensions repo (EXTENSIONS_REPO below): APK, icon and
# index entry of each, the other extensions are left untouched. Also writes the repo's repo.json, its name and
# the fingerprint of the key the extensions are signed with, that the app offers to trust when the repo is added.
#
# Run it from the Actions tab ("Run workflow") with the extensions to release, e.g. "en.animepahe fr.franime".
# Bump extVersionCode first: a version code that isn't above the published one is refused. So is a source whose
# ID isn't the published one any more (users' libraries are keyed by it), unless "allow_id_change" is ticked.
#
# Secrets (Settings > Secrets and variables > Actions):
#   EXTENSIONS_KEYSTORE_BASE64     the keystore signing the published extensions, base64-encoded (KEY_FILE in .env)
#   EXTENSIONS_KEY_STORE_PASSWORD  its password (KEY_STORE_PASSWORD in .env), also used for the key
#   EXTENSIONS_KEY_ALIAS           the key alias (ALIAS in .env)
#   EXTENSIONS_REPO_TOKEN          fine-grained token with "Contents: Read and write" on the extensions repo
#
# Variables (same page, Variables tab), optional, for a fork or a copy of this template publishing its own repo:
#   EXTENSIONS_REPO                the repo to publish to, as <owner>/<repo>, pushed to on its default branch.
#                                  tadamiorg/tadami-extensions for tadamiorg, <owner>/tadami-extensions otherwise
#   EXTENSIONS_REPO_NAME           the repo name in repo.json: Tadami for tadamiorg, the owner otherwise (the app
#                                  doesn't show a name containing "tadami", but the official repo's own)
#   EXTENSIONS_REPO_SHORT_NAME     its short name (the name)
#   EXTENSIONS_REPO_WEBSITE        its website (this repo on GitHub)
name: Release extensions

on:
  workflow_dispatch:
    inputs:
      extensions:
        description: 'Extensions to release, as <lang>.<name> separated by spaces or commas (e.g. "en.animepahe fr.franime")'
        required: true
        type: string
      dry_run:
        description: Build and check everything, but don't push to the extensions repo
        type: boolean
        default: false
      allow_id_change:
        description: Publish even if a source lost its published ID (its users lose their library entries)
        type: boolean
        default: false

# Two releases at once would race on the index
concurrency:
  group: release-extensions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Through the environment rather than interpolated in scripts: it is user input
      CI_EXTENSIONS: ${{ inputs.extensions }}
      EXTENSIONS_REPO: ${{ vars.EXTENSIONS_REPO || (github.repository_owner == 'tadamiorg' && 'tadamiorg/tadami-extensions' || format('{0}/tadami-extensions', github.repository_owner)) }}
    steps:
      - name: Check out the extensions source
        uses: actions/checkout@v4

      # The source IDs are generated from tadami.repoId: a copy keeping the official one would give its new
      # sources the IDs the official repo's sources of the same package and class get
      - name: Check the repo ID
        run: |
          repo_id=$(sed -n 's/^tadami\.repoId=//p' gradle.properties | tr -d '[:space:]')
          if [ "$repo_id" = "tadamiorg/tadami-extensions-source" ] && [ "$GITHUB_REPOSITORY" != "tadamiorg/tadami-extensions-source" ]; then
            echo "::error::tadami.repoId in gradle.properties is the official repo's: set it to $GITHUB_REPOSITORY before releasing"
            exit 1
          fi

      - name: Check the requested extensions
        id: extensions
        run: echo "tasks=$(python3 .github/scripts/publish_extensions.py tasks --extensions "$CI_EXTENSIONS")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EXTENSIONS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The EXTENSIONS_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          # Line breaks or spaces pasted with the value would break the decoding
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/extensions.jks"
          echo "KEY_FILE=$RUNNER_TEMP/extensions.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEY_STORE_PASSWORD: ${{ secrets.EXTENSIONS_KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.EXTENSIONS_KEY_ALIAS }}
          TASKS: ${{ steps.extensions.outputs.tasks }}
        # settings.gradle.kts only loads the extensions listed in CI_EXTENSIONS. gradlew isn't executable in git.
        # The builds write the source IDs the release reads (build/outputs/tadami/sources.json). The template's
        # example extension is built too, so that it keeps compiling against the lib (gone once set up).
        run: |
          chmod +x ./gradlew
          example=""
          if [ -d template/example ]; then example=":template:example:assembleDebug"; fi
          ./gradlew checkSourceIdFormula $TASKS $example --console=plain

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: extensions/*/*/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Check out the extensions repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EXTENSIONS_REPO }}
          # Reading works without it (public repo), pushing needs it
          token: ${{ secrets.EXTENSIONS_REPO_TOKEN || github.token }}
          path: extensions-repo

      - name: Add the extensions to the repo
        env:
          REPO_NAME: ${{ vars.EXTENSIONS_REPO_NAME || (github.repository_owner == 'tadamiorg' && 'Tadami' || github.repository_owner) }}
          REPO_SHORT_NAME: ${{ vars.EXTENSIONS_REPO_SHORT_NAME }}
          REPO_WEBSITE: ${{ vars.EXTENSIONS_REPO_WEBSITE || format('https://github.com/{0}', github.repository) }}
          ALLOW_ID_CHANGE: ${{ inputs.allow_id_change && '--allow-id-change' || '' }}
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # shellcheck disable=SC2086 # ALLOW_ID_CHANGE is empty or one flag
          python3 .github/scripts/publish_extensions.py publish $ALLOW_ID_CHANGE \
            --extensions "$CI_EXTENSIONS" \
            --repo extensions-repo \
            --aapt2 "$build_tools/aapt2" \
            --apksigner "$build_tools/apksigner" \
            --dexdump "$build_tools/dexdump" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --commit-message "$RUNNER_TEMP/commit-message.txt" \
            --repo-name "$REPO_NAME" \
            --repo-short-name "$REPO_SHORT_NAME" \
            --repo-website "$REPO_WEBSITE"
          git -C extensions-repo status --short

      - name: Push to the extensions repo
        if: ${{ !inputs.dry_run }}
        working-directory: extensions-repo
        env:
          HAS_TOKEN: ${{ secrets.EXTENSIONS_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::The EXTENSIONS_REPO_TOKEN secret is missing, nothing was pushed to $EXTENSIONS_REPO"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed in the extensions repo"
            exit 0
          fi
          git commit --file "$RUNNER_TEMP/commit-message.txt"
          git push
