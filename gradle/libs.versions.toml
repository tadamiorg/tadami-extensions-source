[versions]
# Gradle
agp_version = "9.2.1"
kotlin_version = "2.4.0"
dotenv_version = "4.0.0"
# Kotlin serialization
serialization_version = "1.11.0"
# Coroutines
coroutines_version = "1.11.0"
# DI
injekt_version = "91edab2317"
# RXJAVA3
rxjava3_version = "3.1.12"
# Scraping stuff
jsoup_version = "1.22.2"
okhttp_version = "5.4.0"
jspecify_version = "1.0.0"

[libraries]
# Gradle
gradle-agp = { module = "com.android.tools.build:gradle", version.ref = "agp_version" }
gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin_version" }
gradle-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin_version" }
gradle-dotenv = { module="co.uzzu.dotenv:gradle", version.ref = "dotenv_version"}

# Kotlin serialization
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin_version" }
kotlin-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization_version" }
kotlin-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization_version" }
kotlin-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization_version" }

# Coroutines
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines_version" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines_version" }

# DI
injekt-core = { module = "com.github.mihonapp:injekt", version.ref = "injekt_version" }

# RXJAVA3
rxjava3 = { group = "io.reactivex.rxjava3", name = "rxjava", version.ref = "rxjava3_version" }

# Scraping stuff
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup_version" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp_version" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify_version" }

# Extension API (extensions-lib), compileOnly: the app provides it at runtime. One entry per lib
# version, picked by the extension's apiVersion in common.gradle
tadami-lib-v1_6 = "com.github.tadamiorg:tadami:lib-1.6.0"
# Not released yet: only resolves with -Ptadami.localLib (see settings.gradle.kts)
tadami-lib-v1_7 = "com.github.tadamiorg:tadami:lib-1.7.0"

[bundles]
common = [
    "kotlin-stdlib",
    "injekt-core",
    "rxjava3",
    "kotlin-protobuf",
    "kotlin-json",
    "kotlin-json-okio",
    "jsoup",
    "okhttp",
    "jspecify",
    "coroutines-core",
    "coroutines-android"
]

[plugins]
dotenv = { id="co.uzzu.dotenv.gradle", version.ref="dotenv_version" }

